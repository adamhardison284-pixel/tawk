name: Selenium Tawk Bot

on:
  workflow_dispatch:

jobs:
  selenium:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          

      - name: Show versions
        run: |
          python --version
          google-chrome --version
          
      - name: Remove old ChromeDriver
        run: |
          sudo rm -f /usr/bin/chromedriver
          sudo rm -f /usr/local/bin/chromedriver
          
      - name: Run Selenium
        run: |
          python -u tawk_headless.py
          
      - name: Archive Production Screenshots
        if: always() # Runs even if the script fails or crashes
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: screenshots/ # Uploads all captured .png files
          if-no-files-found: warn
